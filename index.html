<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI per le funzioni aziendali · ChangeLab Tech</title>
<meta name="description" content="ChangeLab Tech: dall'analisi all'implementazione dell'AI e formazione AI per funzione aziendale, con esempi di laboratori per dieci funzioni.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2F7; --card:#FFFFFF; --ink:#15141A; --ink2:#3A3842; --muted:#6B6975;
  --line:#E2DFEC; --lav:#ECE8FB; --lav2:#DCD5F6; --violet:#5B4BC4; --deep:#2E2856;
  --orange:#F2602F; --orange-d:#DB5022;
  --sand:#F4EBDD; --sand-ink:#77531F; --sage:#E3EEE7; --sage-ink:#2D5A43;
  --r:22px; --max:1040px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:'IBM Plex Sans Condensed',Helvetica,Arial,sans-serif;font-weight:600;letter-spacing:-.005em;line-height:1.15}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:8px}
#view:focus,#view:focus-visible{outline:none}
a.main-step,a.cont,a.fn,a.mi,a.brand{text-decoration:none;color:inherit}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(243,242,247,.94);backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:16px}
.top .wrap + .wrap{height:auto;display:block}
body.hero-mode .top .wrap + .wrap{display:none}
.menu-btn{border:1px solid var(--line);background:rgba(255,255,255,.6)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand img{height:44px;width:auto}
.brand span{font-size:13.5px;color:var(--muted);letter-spacing:.02em}
.menu-btn{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:999px;font-size:15px;font-weight:500;color:var(--deep)}
.menu-btn:hover{background:var(--lav)}
.burger{width:18px;height:12px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2px;background:var(--deep);border-radius:2px}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:5px}.burger i:nth-child(3){top:10px}
.progress{display:flex;gap:6px;padding:0 0 12px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.progress i.on{background:var(--violet)}

/* screens */
main{padding:28px 0 140px}
.screen{animation:in .45s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{white-space:nowrap;display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.tag.opt{background:var(--sand);color:var(--sand-ink)}
.tag.need{background:var(--sage);color:var(--sage-ink)}
.h1{font-size:clamp(34px,5.4vw,58px);letter-spacing:-.03em;max-width:880px}
.h2{font-size:clamp(28px,4vw,42px);max-width:820px}
.hl{color:var(--orange)}
.lead{font-size:clamp(17px,2vw,19.5px);color:var(--ink2);max-width:720px;margin-top:16px}
.small{font-size:15px;color:var(--muted)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.sec-title{font-size:21px;margin:44px 0 14px}

.card{background:var(--card);border-radius:var(--r);padding:24px}
.soft{background:var(--lav);border-radius:var(--r);padding:22px 24px;color:var(--deep)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 24px;font-weight:700;font-size:16px;text-decoration:none;transition:background .15s,transform .1s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-d)}
.btn.quiet{background:var(--lav);color:var(--deep)}
.btn.quiet:hover{background:var(--lav2)}
.link{color:var(--violet);font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}

/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(to top,rgba(243,242,247,1) 60%,rgba(243,242,247,0));padding:26px 0 calc(18px + env(safe-area-inset-bottom))}
.bottom .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bottom .btn{padding:13px 22px}
.bottom .next{margin-left:auto}

/* home path */
.path{margin-top:40px;display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:stretch}
.main-step{background:var(--card);border-radius:26px;padding:28px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.main-step:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(46,40,86,.08)}
.main-step h3{font-size:26px}
.main-step p{color:var(--ink2)}
.main-step .go{margin-top:auto;padding-top:12px;color:var(--violet);font-weight:700}
.conts{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:22px}
.conts::before{content:"";position:absolute;left:6px;top:18px;bottom:18px;width:2px;background:var(--line);border-radius:2px}
.cont{background:var(--card);border-radius:18px;padding:16px 18px;text-align:left;position:relative;transition:transform .2s}
.cont::before{content:"";position:absolute;left:-22px;top:50%;width:16px;height:2px;background:var(--line)}
.cont:hover{transform:translateX(3px)}
.cont h4{font-size:17px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.cont p{font-size:14.5px;color:var(--muted);margin-top:2px}

/* steps row (process) */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
.fstep{background:var(--card);border-radius:18px;padding:16px;text-align:left;border:2px solid transparent;transition:border-color .2s}
.fstep[aria-expanded="true"]{border-color:var(--violet)}
.fstep b{display:block;font-family:'IBM Plex Sans Condensed',sans-serif;font-size:16.5px;font-weight:600}
.fstep span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.fdetail{margin-top:10px}

/* accordion blocks */
.blk{background:var(--card);border-radius:var(--r);overflow:hidden}
.blk + .blk{margin-top:12px}
.blk-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;text-align:left}
.blk-h h3{font-size:21px}
.blk-h p{font-size:15px;color:var(--muted);margin-top:3px;font-family:'IBM Plex Sans',sans-serif;font-weight:400;letter-spacing:0}
.chev{flex:none;width:34px;height:34px;border-radius:50%;background:var(--lav);display:grid;place-items:center;transition:transform .25s}
.chev svg{width:14px;height:14px}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.blk-b{padding:0 24px 24px;display:none}
.blk-b.open{display:block;animation:in .35s ease}

.list{list-style:none;display:grid;gap:10px}
.list li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.list li b{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;color:var(--violet);min-width:18px}
.list li span{color:var(--ink2)}
.list li strong{color:var(--ink);font-weight:600}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink2);background:var(--bg)}
.tab[aria-selected="true"]{background:var(--deep);color:#fff}
.pane{display:none;margin-top:14px}
.pane.on{display:block;animation:in .3s ease}

/* level ladder (example) */
.ladder{display:grid;gap:8px;margin-top:14px}
.rung{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-radius:16px;background:var(--bg);font-size:15px;color:var(--ink2);opacity:.35;transition:opacity .35s,background .35s}
.rung.on{opacity:1;background:var(--lav);color:var(--deep)}
.rung .lv{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;min-width:110px}
.chip-s{background:#fff;border-radius:999px;padding:4px 10px;font-size:13.5px}
.chip-s.h{background:var(--deep);color:#fff}

/* function cards */
.fns{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:32px}
.fn{background:var(--card);border-radius:24px;padding:22px;display:grid;grid-template-columns:112px 1fr;gap:20px;align-items:center;text-align:left;transition:transform .2s,box-shadow .2s}
.fn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(46,40,86,.08)}
.fn svg{width:112px;height:88px}
.fn h3{font-size:21px}
.fn p{font-size:15px;color:var(--muted);margin-top:4px}
.fn .go{display:block;margin-top:10px;color:var(--violet);font-weight:700;font-size:15px}

/* lab screen */
.fn-head{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;margin-top:4px}
.rules{background:var(--lav);border-radius:18px;padding:18px 20px;color:var(--deep);font-size:15px}
.rules h4{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;font-family:'IBM Plex Sans',sans-serif;font-weight:700}
.rules li{list-style:none;margin:5px 0}
.labtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:32px}
.labtab{background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;border:2px solid transparent;transition:border-color .2s}
.labtab[aria-selected="true"]{border-color:var(--violet)}
.labtab b{display:block;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:16px}
.labtab span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.lab{background:var(--card);border-radius:24px;padding:26px;margin-top:10px}
.lab h3{font-size:22px}
.four{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.four > div{background:var(--bg);border-radius:16px;padding:16px 18px}
.four > div.res{background:var(--lav)}
.four h4{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--deep)}
.four p{font-size:15.5px;color:var(--ink2)}
.lab-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}

/* mentoring */
.quote{font-size:clamp(19px,2.3vw,23px);line-height:1.45;color:var(--deep);border-left:3px solid var(--lav2);padding-left:20px;max-width:820px;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:500;letter-spacing:-.01em}
.pills{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;color:var(--ink2)}
.pills b{color:var(--ink);font-weight:600}
.pk{text-align:center;padding:22px 16px}
.pk h4{font-size:19px}
.pk .n{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:30px;font-weight:600;color:var(--violet);margin:6px 0 2px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.facts div{background:var(--card);border-radius:16px;padding:14px 16px}
.facts span{display:block;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts b{font-weight:600}
.inline-steps{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;color:var(--ink2)}
.inline-steps b{color:var(--violet);font-family:'IBM Plex Sans Condensed',sans-serif}

/* implementation */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:34px;position:relative}
.stage{background:var(--card);border-radius:18px;padding:16px 18px;text-align:left;border:2px solid transparent;transition:border-color .2s}
.stage[aria-selected="true"]{border-color:var(--violet)}
.stage b{display:block;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:18px}
.stage span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.stage em{font-style:normal;color:var(--violet);font-weight:700;font-size:13.5px}
.spanel{background:var(--card);border-radius:24px;padding:28px;margin-top:10px}
.spanel h3{font-size:24px}
.cols3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin-top:20px}
.cols3 > div{background:var(--bg);border-radius:16px;padding:16px 18px}
.cols3 h4{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Sans',sans-serif;font-weight:700;margin-bottom:8px}
.cols3 ul{list-style:none;display:grid;gap:7px;color:var(--ink2);font-size:15.5px}
.cols3 .dec{background:var(--lav);color:var(--deep)}
.cols3 .dec h4{color:var(--deep)}
.cols3 .dec p{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:17px;margin-bottom:6px}

/* contact */
.choice h4{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Sans',sans-serif;font-weight:700;margin:26px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--card);font-size:15px;color:var(--ink2);transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--deep);color:#fff}
.sign{display:flex;gap:14px;align-items:center;margin-top:36px;color:var(--muted);font-size:15px}

/* menu overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(21,20,26,.28);display:none}
.ov.open{display:block}
.sheet{position:absolute;right:16px;top:12px;width:min(420px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;background:var(--card);border-radius:26px;padding:20px;animation:in .3s ease}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-h span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.x{width:36px;height:36px;border-radius:50%;background:var(--lav);font-size:20px;line-height:1;color:var(--deep)}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 12px;border-radius:14px;text-align:left;font-size:17px;font-weight:500;text-decoration:none}
.mi:hover,.mi.cur{background:var(--bg)}
.mi.sub{font-size:15px;color:var(--ink2);padding:9px 12px 9px 28px}

/* responsive */
@media (max-width:900px){
  .flow{grid-template-columns:repeat(2,1fr)}
  .g4,.facts{grid-template-columns:repeat(2,1fr)}
  .g3,.cols3{grid-template-columns:1fr}
  .fn-head{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:720px){
  .path{grid-template-columns:1fr}
  .fns,.g2,.four{grid-template-columns:1fr}
  .labtabs{grid-template-columns:1fr}
  .brand span{display:none}
  .menu-btn em{display:none}
  .fn{grid-template-columns:84px 1fr;gap:14px}
  .fn svg{width:84px;height:66px}
  main{padding-top:18px}
  .bottom .btn{padding:12px 18px;font-size:15px}
}
@media (max-width:420px){
  .flow,.g4,.facts,.stages{grid-template-columns:1fr}
}

/* ===== hero screens (home, implementazione) ===== */
body.hero-mode{background:radial-gradient(120% 90% at 85% 0%,#F6EFEA 0%,rgba(246,239,234,0) 55%),linear-gradient(180deg,#F7F6FA 0%,#F3F2F7 100%)}
body.hero-mode main{padding:0}
body.hero-mode .progress{display:none}
body.hero-mode .top{background:transparent;backdrop-filter:none;position:relative}
.hero{position:static;min-height:calc(100vh - 58px);min-height:calc(100svh - 58px);display:flex;flex-direction:column;padding:2.2vh 0 2.2vh}
.orb{position:absolute;top:-30px;right:-7vw;width:min(48vw,700px);aspect-ratio:1;border-radius:50%;overflow:hidden;z-index:0;
  background:radial-gradient(circle at 35% 40%,#FBEFE8 0%,#ECE8FB 60%,#E4DEF7 100%)}
.orb img{width:100%;height:100%;object-fit:cover;object-position:30% 50%;filter:saturate(.75)}
.orb .veil{position:absolute;inset:0;background:linear-gradient(105deg,rgba(247,246,250,.95) 0%,rgba(247,246,250,.7) 45%,rgba(247,246,250,.52) 100%)}
.orb .arc{position:absolute;border-radius:50%;border:1px solid rgba(242,96,47,.35)}
.orb .a1{inset:6%}.orb .a2{inset:14% -10% -10% 14%;border-color:rgba(91,75,196,.18)}
.claim{position:absolute;z-index:1;right:clamp(24px,10vw,160px);top:12vh;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:#8C8A96;line-height:1.9}
.hero-txt{position:relative;z-index:2;max-width:620px;margin-top:3vh}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ht{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:500;font-size:clamp(34px,4.6vw + 1vh,64px);letter-spacing:-.025em;line-height:1.05;margin-top:2vh}
.hs{font-size:clamp(17px,1.5vw,21px);color:var(--ink);margin-top:2vh;max-width:520px;line-height:1.4}
.hp{font-size:clamp(14px,1.05vw,15.5px);color:var(--muted);margin-top:1.6vh;max-width:520px}
.rule{display:block;width:46px;height:2px;background:var(--orange);margin-top:2.6vh;border-radius:2px}
.lbl{position:relative;z-index:2;margin-top:3.6vh;font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px}
.lbl::after{content:"";width:34px;height:1px;background:var(--line)}
.hcards{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:1.8vh}
.hcards::before{content:"";position:absolute;left:4%;right:4%;top:50%;height:1px;background:var(--line);z-index:-1}
.hcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);
  border-radius:16px;padding:clamp(14px,2vh,22px) 20px;box-shadow:0 1px 2px rgba(46,40,86,.04),0 8px 24px rgba(46,40,86,.05);text-decoration:none;color:inherit;
  border-left:3px solid var(--acc);transition:transform .2s,box-shadow .2s}
.hcard:hover,.hcard.sel{transform:translateY(-3px);box-shadow:0 14px 34px rgba(46,40,86,.10)}
.hcard .hn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:14px;background:var(--accbg);color:var(--acc)}
.hcard .ha{position:absolute;right:18px;top:clamp(20px,2.6vh,30px);color:var(--acc);font-size:15px}
.hcard b{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:16px;margin-top:1.4vh}
.hcard em{font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
.hcard .hd{font-size:13.5px;line-height:1.45;color:var(--ink2);margin-top:1.4vh}
.c1{--acc:#5B4BC4;--accbg:#ECE8FB}.c2{--acc:#E0622F;--accbg:#FDECE4}.c3{--acc:#3F5BB8;--accbg:#E6EBFA}.c4{--acc:#3E7A5A;--accbg:#E3F0E8}
.hbar{position:relative;z-index:2;margin-top:2.6vh;display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 10px}
.hlink{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;padding:4px 8px}
.hico{width:30px;height:30px;border-radius:50%;background:var(--lav);color:var(--violet);display:grid;place-items:center;font-size:14px}
.hguide{font-size:13.5px;color:var(--violet);text-decoration:none;font-weight:600;padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:10px}
.hguide::before{content:"";width:28px;height:1px;background:var(--lav2)}
.hguide.strong{background:var(--orange);color:#fff}
.hguide.strong::before{display:none}
.hfoot{position:relative;z-index:2;margin-top:auto;padding-top:2vh;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.hdots{display:flex;gap:6px;align-items:center}
.hdots i{width:6px;height:6px;border-radius:50%;background:var(--lav2)}
.hdots i.on{width:20px;border-radius:3px;background:var(--violet)}
/* drawer */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(21,20,26,.18);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer.open{opacity:1;pointer-events:auto}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;padding:34px 34px 28px;overflow:auto;transform:translateX(30px);transition:transform .3s;box-shadow:-20px 0 60px rgba(46,40,86,.12)}
.drawer.open .dpanel{transform:none}
.dpanel .dclose{position:absolute;top:18px;right:18px}
.dpanel .dn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:600;font-family:'IBM Plex Sans Condensed',sans-serif;margin-right:8px}
.dpanel h3{font-size:24px;margin-top:14px}
.dintro{color:var(--ink2);margin-top:8px}
.dpanel h4{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Sans',sans-serif;font-weight:700;margin:22px 0 8px}
.dpanel ul{list-style:none;display:grid;gap:8px}
.dpanel li{padding-left:16px;position:relative;color:var(--ink2);font-size:15.5px}
.dpanel li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:1.5px;background:var(--violet)}
.ddec{background:var(--lav);border-radius:16px;padding:16px 18px;margin-top:22px;color:var(--deep)}
.ddec h4{margin-top:0;color:var(--deep)}
.ddec p{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:17px}
.ddec span{font-size:14px}
.dnav{display:flex;justify-content:space-between;margin-top:22px}

@media (max-height:800px) and (min-width:900px){.hp{display:none}.hcard .hd{font-size:13px}.hero-txt{margin-top:1.2vh}.lbl{margin-top:2.6vh}.ht{margin-top:1.2vh}}
@media (max-width:900px){
  .hcards{grid-template-columns:repeat(2,1fr);gap:10px}
  .hcards::before{display:none}
  .orb{width:300px;right:-110px;top:-40px}
  .claim{display:none}
}
@media (max-width:720px){
  .hero{min-height:calc(100svh - 64px);padding-top:0}
  .hero-txt{margin-top:2vh;max-width:100%}
  .orb{width:240px;right:-110px;top:-20px}
  .orb .veil{background:rgba(247,246,250,.72)}
  .ht{font-size:31px;margin-top:10px}
  .hs{font-size:16px;margin-top:10px;max-width:92%}
  .hp{display:none}
  .rule{margin-top:14px}
  .lbl{margin-top:20px}
  .hcards{margin-top:10px}
  .hcard{padding:12px 12px 13px;border-radius:14px}
  .hcard .hn{width:28px;height:28px;font-size:12px}
  .hcard .ha{right:12px;top:16px}
  .hcard b{font-size:14.5px;margin-top:8px;line-height:1.2}
  .hcard em{font-size:11.5px}
  .hcard .hd{font-size:12.5px;line-height:1.4;margin-top:6px}
  .hbar{margin-top:14px;border-radius:18px;padding:6px}
  .hlink{font-size:13.5px}
  .hguide{display:none}
  .hguide.strong{display:flex;font-size:13px;padding:8px 12px}
  .hfoot span{display:none}
  .hfoot{padding-top:14px;padding-bottom:10px}
  .dpanel{top:auto;width:100%;max-height:86vh;border-radius:22px 22px 0 0;transform:translateY(30px);padding:26px 22px}
}


/* ===== home: two blocks ===== */
.home .hero-txt{max-width:600px;margin-top:1.2vh}
.home .ht{font-size:clamp(26px,2.7vw + .6vh,46px);line-height:1.1;margin-top:1.4vh}
.home .hs{color:var(--ink2);font-size:clamp(14px,1.1vw,16.5px);max-width:540px;margin-top:1.6vh}
.twob{position:relative;z-index:2;display:grid;grid-template-columns:2.1fr 1fr;gap:14px;margin-top:2.6vh;align-items:stretch}
.bk{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-radius:20px;padding:clamp(16px,2.4vh,24px) 22px;box-shadow:0 1px 2px rgba(46,40,86,.04),0 10px 30px rgba(46,40,86,.06);display:flex;flex-direction:column}
.bk-h{display:flex;gap:14px;align-items:flex-start}
.bn{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:14px;background:var(--accbg);color:var(--acc)}
.bk h2{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:clamp(16px,1.3vw,19px);letter-spacing:-.01em}
.bk-h p{font-size:13px;color:var(--muted);margin-top:2px}
.bk-h .tag{margin-top:6px}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:clamp(12px,2vh,18px)}
.part{display:flex;flex-direction:column;gap:5px;background:var(--bg);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;transition:background .15s,transform .15s}
.part:hover{background:var(--lav);transform:translateY(-2px)}
.part b{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:13.5px;line-height:1.25}
.part b .tag{display:table;margin-top:5px;font-size:10px;padding:3px 8px}
.part span{font-size:12.5px;line-height:1.4;color:var(--ink2)}
.bk-f{margin-top:auto;padding-top:clamp(12px,2vh,18px)}
.bk-f .btn{padding:11px 20px;font-size:14px}
.bk.side{background:rgba(255,255,255,.72)}
.bk-d{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.45}
.stg{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;counter-reset:s}
.stg li{counter-increment:s;font-size:11.5px;background:var(--sage);color:var(--sage-ink);border-radius:999px;padding:5px 10px;font-weight:500}
.stg li::before{content:counter(s) " · ";font-weight:700}
.bk-l{margin-top:auto;padding-top:12px;font-size:13px}
.hero:not(.home) .ht{font-size:clamp(25px,2.5vw + .5vh,42px)}
.hero:not(.home) .hs{font-size:clamp(14.5px,1.1vw,16.5px);margin-top:1.3vh;max-width:500px}

.hero:not(.home) .hcard .hd{font-size:12.8px;margin-top:1vh}

.home .hfoot{padding-top:1.6vh;padding-bottom:1vh;margin-top:0}
.hero.home .hero-txt{margin-top:3vh}
.home .kick{color:#F2602F;font-weight:700}
.orb{top:-115px;right:-85px;width:min(36vw,540px)}
.orb img{object-position:28% 60%;filter:saturate(.7) brightness(1.06)}
.orb .veil{background:linear-gradient(115deg,rgba(247,246,250,.94) 0%,rgba(247,246,250,.66) 38%,rgba(247,246,250,.4) 68%,rgba(247,246,250,.28) 100%)}
.orb .a1{inset:3.5%;border-color:rgba(242,96,47,.5);border-width:1.5px}

var FN=[
 {id:"pm",name:"Project Management",short:"Documentazione di progetto, varianti, avanzamento e rischi.",
  title:"Dalla documentazione di progetto a una gestione più informata",
  intro:"Contratti, specifiche, verbali, avanzamento e rischi cambiano di continuo e il Project Manager deve raccogliere, confrontare e aggiornare queste informazioni. Nei laboratori l'AI prepara il materiale e supporta l'analisi, lasciando a lui le decisioni.",
  rules:["La decisione resta al Project Manager","Nessuna modifica automatica del piano","Impegni contrattuali solo con approvazione formale","Nessun report al cliente senza approvazione del PM"],
  labs:[
   ["Eventi critici e varianti","Durante il progetto arriva un evento: un componente critico in ritardo, una modifica richiesta dal cliente, un collaudo da ripetere.","Con l'AI ricostruire gli impatti su date di consegna, penali e obblighi contrattuali, costi, documentazione e collaudi; confrontare le opzioni e preparare una proposta di gestione.","Controllare ipotesi e numeri, distinguere i fatti dalle stime e segnalare ciò che richiede una decisione del PM.","Un modello riutilizzabile per analizzare eventi critici e preparare proposte di gestione."],
   ["Assistente per la documentazione di progetto","Il team deve trovare rapidamente informazioni in contratto, specifiche, varianti e verbali, con revisioni che si susseguono.","Fornire all'AI i documenti di progetto e ottenere risposte con documento, revisione e sezione citati, rispettando l'ordine di prevalenza contrattuale; preparare la matrice degli obblighi (deliverable, milestone, penali, garanzie) e la bozza di una richiesta di variante.","Verificare le fonti citate, controllare che prevalgano le varianti firmate e l'ultima revisione, riconoscere quando l'informazione non è nei documenti.","Schema della base di conoscenza di progetto, matrice degli obblighi e bozza di richiesta di variante."],
   ["Monitoraggio di avanzamento e rischi","Ogni settimana il PM raccoglie lo stato di fornitori, attività, collaudi, documenti da consegnare, non conformità aperte e milestone, e prepara il report.","Progettare un flusso in cui l'AI raccoglie i dati, individua gli scostamenti rispetto alla baseline approvata, prepara il report e propone azioni di recupero.","Definire cosa segnala l'AI, cosa approva il PM e quando scatta l'escalation; nessun report o comunicazione al cliente senza approvazione del PM.","Schema del flusso di lavoro con ruoli, controlli e punti di decisione umana."]]},
 {id:"offerte",name:"Offerte e gare",short:"Richieste d'offerta e bandi, requisiti, deviazioni e chiarimenti.",
  title:"Dalla richiesta d'offerta a una proposta più solida",
  intro:"Richieste d'offerta e bandi arrivano con molte pagine di specifiche, standard e condizioni, e con tempi stretti. Un'unica opportunità complessa attraversa i tre laboratori, dalla prima analisi fino al processo che coinvolge più team.",
  rules:["Prezzi, condizioni e impegni restano al team d'offerta","Deviazioni ed eccezioni approvate secondo le deleghe aziendali","Riservatezza delle informazioni commerciali","Fonti verificabili"],
  labs:[
   ["Analisi della richiesta d'offerta","Arriva una richiesta d'offerta o un bando con specifiche, standard richiamati, criteri di valutazione e condizioni contrattuali, e poche settimane per rispondere.","Estrarre con l'AI requisiti chiave, scadenze, criteri di aggiudicazione e rischi; preparare una prima matrice di conformità e l'elenco delle domande di chiarimento.","Controllare ogni requisito estratto sul documento originale e segnalare ciò che l'AI non ha trovato o ha interpretato; le valutazioni tecniche restano alle funzioni competenti.","Matrice di conformità iniziale, elenco dei chiarimenti e istruzioni riutilizzabili per le prossime offerte."],
   ["Evidenze, deviazioni e riuso delle offerte precedenti","Per rispondere servono offerte precedenti, deviazioni già concordate, documentazione di prodotto e risposte tecniche già scritte.","Costruire con l'AI una base di riferimento dalle offerte passate; preparare bozze di risposta, una proposta di valore con la fonte di ogni affermazione e la lista delle deviazioni tecniche e delle eccezioni commerciali, tenute separate.","Verificare che ogni contenuto riutilizzato valga per questa offerta e questa revisione; distinguere ciò che è documentato da ciò che va confermato.","Base di riferimento delle offerte, proposta di valore con fonti e lista delle deviazioni."],
   ["Il processo d'offerta tra più team","Un'offerta coinvolge Sales, ufficio gare, funzioni tecniche, Supply Chain, Finance e Legal, con passaggi e approvazioni.","Mappare le fasi del processo d'offerta (analisi dei requisiti, revisione tecnica, valutazione commerciale, approvazione finale) e progettare dove l'AI prepara, coordina e controlla, lasciando le decisioni alle persone.","Definire ruoli, fonti, controlli e punti di approvazione.","Mappa del processo e un caso d'uso AI strutturato da esplorare internamente."]]},
 {id:"qualita",name:"Qualità e HSE",short:"Non conformità, cause radice, segnalazioni HSE e lessons learned.",
  title:"Usare l'esperienza dei casi passati per gestire meglio quelli futuri",
  intro:"Ogni non conformità e ogni segnalazione HSE contiene informazioni utili per i casi successivi. Nei laboratori l'AI aiuta a preparare la documentazione, confrontare i casi precedenti e individuare le ricorrenze, lasciando le valutazioni alle persone.",
  rules:["Le valutazioni di qualità e sicurezza restano alle persone","Accettazioni, deroghe e chiusure non delegabili","Coerenza con il sistema di gestione aziendale (es. ISO 9001, ISO 45001)","Tracciabilità delle evidenze"],
  note:"Altri casi possibili da definire insieme: flusso CAPA assistito, piani di controllo, collaudo finale, dossier di qualità, qualità dei fornitori.",
  labs:[
   ["Redazione assistita dei rapporti di non conformità (NCR)","In produzione, al collaudo o dal campo viene rilevata una non conformità: descrizione sommaria, qualche foto, informazioni incomplete.","Preparare con l'AI una bozza di NCR strutturata a partire dal modello aziendale: descrizione, codice e lotto o matricola, fase di rilevazione, requisito violato, classificazione proposta e azioni di contenimento.","L'AI segnala i dati mancanti e non inventa informazioni; classificazione e riferimento al requisito sono confermati dall'ispettore.","Modello di NCR assistita e istruzioni testate."],
   ["Analisi delle cause radice con i casi precedenti","Una nuova non conformità somiglia a casi già visti, ma l'esperienza è sparsa tra archivio NCR, rapporti 8D, lessons learned, collaudi e segnalazioni dal campo.","Confrontare il nuovo caso con lo storico, proporre cause radice da verificare (5 Why, Ishikawa), individuare i casi simili già risolti e proporre azioni correttive (CAPA) da valutare.","Distinguere ipotesi e fatti documentati; verificare che i casi simili abbiano la stessa configurazione (fornitore, lotto, materiale, revisione); controllare ogni confronto sulla fonte.","Scheda di confronto con i casi simili e schema della base di conoscenza delle non conformità."],
   ["Segnalazioni HSE e near miss","Near miss, osservazioni di sicurezza e incidenti vengono segnalati in formati diversi; le ricorrenze emergono tardi.","Progettare un flusso in cui l'AI classifica le segnalazioni, individua ricorrenze per area, attività e tipo di rischio, prepara una sintesi periodica e la bozza delle lessons learned da condividere.","L'AI non chiude segnalazioni e non decide le azioni; classificazione e azioni sono validate dal responsabile HSE; dati personali trattati secondo le regole aziendali, solo con strumenti AI approvati.","Schema del flusso con punti di controllo umano e modello di sintesi periodica."]]},
 {id:"supply",name:"Supply Chain e acquisti",short:"Offerte dei fornitori, documenti di fornitura, componenti critici e rischi.",
  title:"Dal controllo dei documenti alla gestione anticipata del rischio di fornitura",
  intro:"Materiali, componenti e sottoforniture generano molti documenti, scadenze e segnali da controllare. Nei laboratori l'AI estrae le informazioni, le confronta e segnala in anticipo le situazioni che richiedono attenzione.",
  rules:["Le scelte di acquisto restano al buyer","Conformità tecnica confermata dalle funzioni tecniche","Dati riservati: solo strumenti AI approvati dall'azienda","Nessuna comunicazione ai fornitori senza approvazione"],
  labs:[
   ["Confronto strutturato delle offerte dei fornitori","Arrivano più offerte per la stessa richiesta, in formati diversi e con perimetri non omogenei: esclusioni, Incoterms, validità dei prezzi, tempi di consegna, garanzia.","Normalizzare e confrontare con l'AI le offerte su criteri espliciti (conformità tecnica, prezzo e costo complessivo, tempi di consegna, condizioni, ricambi) e preparare le domande di chiarimento.","Ogni valutazione è motivata e riferita all'offerta; la conformità tecnica è confermata dalle funzioni tecniche; la decisione resta al buyer.","Griglia di confronto riutilizzabile e istruzioni testate."],
   ["Verifica dei documenti di fornitura","Conferme d'ordine, certificati, rapporti di controllo e documenti di trasporto vengono confrontati a mano con l'ordine e le specifiche.","Estrarre con l'AI in una tabella codici, revisioni, quantità, date, lotti e tipo di certificato richiesto, e confrontarli con ordine e specifiche.","Individuare le incongruenze e verificare ogni dato sul documento originale, prima della registrazione o dell'accettazione della merce.","Schema di estrazione e verifica dei documenti di fornitura."],
   ["Monitor del rischio di fornitura","Ritardi e segnali di rischio sui componenti critici emergono quando è troppo tardi per reagire bene.","Progettare un flusso che incrocia date di fabbisogno, conferme dei fornitori e segnali di rischio (fornitore unico, ritardi storici, capacità, obsolescenza), invia avvisi interni e prepara per il buyer opzioni realistiche: accelerare la consegna, ripianificare, attivare un secondo fornitore già qualificato.","Soglie di avviso, fonti dei dati e punti di decisione del buyer definiti; nessuna comunicazione ai fornitori senza approvazione.","Schema del monitoraggio del rischio di fornitura."]]},
 {id:"service",name:"Assistenza tecnica",short:"Manuali e bollettini, richieste di clienti e tecnici, dati delle macchine.",
  title:"Risposte più rapide, sempre basate sulla documentazione",
  intro:"Clienti, rivenditori e tecnici chiedono informazioni su guasti, configurazioni e interventi. Nei laboratori l'AI aiuta a trovare la risposta nella documentazione giusta, citandone sempre la fonte, e a preparare gli interventi.",
  rules:["Ogni risposta cita il manuale o il bollettino di riferimento","Nessuna risposta inviata senza verifica del tecnico","Diagnosi e interventi restano al tecnico","Dati delle macchine e dei clienti: solo strumenti AI approvati dall'azienda"],
  labs:[
   ["Risposta a un cliente o a un tecnico","Arriva una domanda su un guasto o su una configurazione, spesso in un'altra lingua e con poche informazioni.","Preparare con l'AI una bozza di risposta basata sui manuali forniti, con la sezione di riferimento e le domande di chiarimento da porre.","Il tecnico verifica la sezione citata e corregge prima dell'invio; se la documentazione non copre il caso, l'AI lo dichiara.","Istruzioni testate per le risposte tecniche e modello di risposta."],
   ["Base di conoscenza sulle richieste tipiche","Manuali, bollettini di servizio e risposte già date sono sparsi tra cartelle, email e versioni diverse.","Organizzare con l'AI una base consultabile di fonti, versioni e richieste ricorrenti; ottenere risposte che citano documento e revisione e segnalano le lacune della documentazione.","Verificare che prevalga l'ultima revisione; definire chi è responsabile dei contenuti e del loro aggiornamento.","Schema della base di conoscenza ed elenco delle lacune documentali da colmare."],
   ["Dal dato macchina al brief per il tecnico","Prima di un intervento, le informazioni sulla macchina o sull'impianto (allarmi, parametri, interventi precedenti) vanno raccolte e interpretate a mano.","Progettare un flusso in cui l'AI trasforma dati diagnostici e storico degli interventi in un brief leggibile: cosa è successo, componenti coinvolti, verifiche da fare, ricambi da considerare. In aula si lavora su dati di esempio: si progetta il flusso, non lo si collega ai sistemi.","Il tecnico valida l'ipotesi sul campo; la lista dei ricambi è un suggerimento da confermare; nessuna comunicazione al cliente senza verifica.","Schema del flusso, modello di brief pre-intervento e punti di controllo umano."]]},
 {id:"sales",name:"Sales",short:"Richieste di clienti e distributori, proposta di valore, gestione dei contatti.",
  title:"Risposte rapide e coerenti, proposte basate sulle evidenze",
  intro:"Clienti e distributori chiedono informazioni su prodotti, configurazioni, tempi e condizioni; ogni proposta deve essere convincente e verificabile. Nei laboratori l'AI aiuta a preparare risposte, materiali e proposte, lasciando a Sales prezzi, condizioni e impegni.",
  rules:["Prezzi, sconti e condizioni restano a Sales","Specifiche solo dalle schede tecniche ufficiali","Riservatezza delle informazioni commerciali","Fonti verificabili per ogni affermazione"],
  labs:[
   ["Risposta a una richiesta del cliente o del distributore","Arriva una richiesta su un prodotto, una configurazione o una tempistica, a volte in un'altra lingua.","Preparare con l'AI una bozza nel tono dell'azienda e nella lingua richiesta, partendo dalle schede tecniche fornite come contesto, con i punti da verificare.","Sales verifica disponibilità, tempi, prezzi e condizioni; nessuna specifica inventata: ogni dato tecnico ha la sua fonte.","Istruzioni testate e modello di risposta multilingua."],
   ["Proposta di valore basata sulle evidenze","Per un incontro importante o un'offerta servono prove: documentazione di prodotto, casi precedenti, informazioni sul cliente e sui concorrenti.","Costruire con l'AI una base di evidenze e una proposta di valore strutturata, con la fonte di ogni affermazione; preparare l'incontro con domande e possibili obiezioni.","Verificare fonti e coerenza; distinguere ciò che è documentato da ciò che va confermato.","Proposta di valore con fonti chiare e scheda di preparazione dell'incontro."],
   ["Dal nuovo contatto alla proposta","I nuovi contatti arrivano da canali diversi e vengono qualificati e seguiti in modo disomogeneo.","Progettare un flusso in cui l'AI raccoglie i nuovi contatti, li arricchisce con le informazioni disponibili, propone una priorità e prepara il primo messaggio e la bozza di proposta per il commerciale.","Criteri di priorità definiti da Sales; nessun messaggio inviato e nessun impegno preso senza approvazione; dati personali trattati secondo le regole aziendali.","Schema del flusso commerciale con ruoli, controlli e punti di approvazione."]]},
 {id:"marketing",name:"Marketing",short:"Contenuti nel tono del brand, mercati e lingue, feedback dei clienti.",
  title:"Più contenuti, una sola voce del brand",
  intro:"Lanci, eventi e mercati diversi richiedono molti contenuti in molte lingue, sempre coerenti con il brand. Nei laboratori l'AI aiuta a produrre e adattare le bozze, lasciando al marketing scelte e approvazioni.",
  rules:["Ogni contenuto è approvato dal marketing","Claim tecnici verificati sulle schede ufficiali","Solo feedback raccolti dall'azienda o da fonti autorizzate","Rispetto della brand guide e dei diritti su immagini e testi"],
  labs:[
   ["Contenuti nel tono del brand","Per un lancio o un evento servono post, newsletter e comunicati in tempi stretti.","Preparare con l'AI bozze e varianti per canale seguendo la brand guide; confrontare più versioni e definire criteri di qualità.","Il marketing sceglie, corregge e approva; i claim tecnici sono verificati sulle schede ufficiali.","Istruzioni testate per i contenuti ricorrenti e criteri di qualità."],
   ["Adattamento per mercati e lingue","I contenuti vanno adattati per paesi e lingue diversi, mantenendo coerenti lessico tecnico e tono.","Fornire all'AI brand book, glossario e formulazioni da evitare come contesto di lavoro; produrre varianti locali segnalando i termini a rischio.","Marketing locale e brand approvano le varianti; il glossario si aggiorna con le correzioni.","Glossario e contesto riutilizzabile per l'adattamento ai mercati."],
   ["Sintesi dei feedback dei clienti","Recensioni, richieste dei clienti e sondaggi contengono segnali utili, ma nessuno ha il tempo di leggerli tutti.","Progettare un flusso in cui l'AI raggruppa i temi, cita le evidenze e prepara una sintesi mensile per marketing e prodotto, a partire da feedback raccolti dall'azienda o da fonti autorizzate.","Marketing e prodotto interpretano e decidono le priorità; i dati personali sono trattati secondo le regole aziendali.","Schema del flusso e modello di sintesi mensile."]]},
 {id:"finance",name:"Finance",short:"Business plan e budget, analisi degli scostamenti, chiusura mensile.",
  title:"Analisi più rapide, con accuratezza e responsabilità del Finance",
  intro:"Budget, business plan, consuntivi e chiusure richiedono analisi precise e commenti chiari in tempi stretti. Nei laboratori l'AI aiuta a mettere alla prova le ipotesi, spiegare gli scostamenti e coordinare le attività, mentre la responsabilità sull'output resta al Finance.",
  rules:["Riconciliazione con il dato ufficiale","Separazione tra fatti e ipotesi","Tracciabilità delle fonti e segregazione dei compiti","Approvazione del Controller e supervisione umana"],
  labs:[
   ["Stress test di un business plan o di una richiesta di budget","Un business plan o una richiesta di budget deve essere presentato al CFO o al comitato investimenti.","Usare l'AI come «avvocato del diavolo»: simulare il punto di vista del CFO o del comitato, individuare ipotesi deboli, falle logiche e rischi non considerati, e preparare le risposte.","Verificare i calcoli e le ipotesi sui dati ufficiali; distinguere critiche fondate da obiezioni generiche; la valutazione finale resta al Finance.","Istruzioni testate per mettere alla prova i documenti e una checklist delle domande del CFO."],
   ["Analisi degli scostamenti e commento","A ogni chiusura bisogna spiegare gli scostamenti tra budget e consuntivo e scrivere il commento per il management.","Fornire all'AI dati contabili esportati e regole di analisi; scomporre gli scostamenti (volume, prezzo, mix, cambio), individuare i centri di costo fuori controllo e preparare la bozza di commento.","Ogni numero riconciliato con il dato ufficiale; i calcoli sono verificati; le cause proposte sono ipotesi da confermare con i responsabili.","Modello di analisi degli scostamenti e di commento per il pack di chiusura."],
   ["Chiusura mensile coordinata","La chiusura contabile richiede riconciliazioni, solleciti, quadrature e controlli, con molte persone coinvolte.","Progettare un flusso in cui l'AI coordina le attività della chiusura, prepara le evidenze, invia i promemoria e segnala anomalie ed eccezioni.","L'AI non chiude i conti: coordina, prepara e segnala sotto responsabilità del Finance; segregazione dei compiti e approvazioni definite.","Schema del flusso di chiusura con ruoli, controlli e punti di approvazione."]]},
 {id:"hr",name:"HR",short:"Ruoli e annunci, policy e domande dei dipendenti, onboarding.",
  title:"Più tempo per le persone, meno per i documenti",
  intro:"Descrizioni dei ruoli, policy, domande dei dipendenti e inserimento dei nuovi colleghi richiedono molto lavoro documentale. Nei laboratori l'AI aiuta a prepararlo e organizzarlo, mentre le decisioni sulle persone restano sempre alle persone.",
  rules:["Nessuna decisione sulle persone affidata all'AI","Dati personali trattati secondo il GDPR e le regole aziendali","Linguaggio inclusivo e non discriminatorio","Attenzione all'AI Act: l'uso dell'AI nella selezione è ad alto rischio"],
  labs:[

   ["Assistente su policy e procedure HR","I dipendenti fanno spesso le stesse domande su ferie, smart working, rimborsi, formazione e welfare.","Fornire all'AI policy e regolamenti aziendali e ottenere risposte che citano sempre la fonte, oppure dichiarano che l'informazione non è presente.","Testare l'assistente con domande vere e domande senza risposta nei documenti; definire chi aggiorna le policy e quando una domanda passa a HR.","Schema della base di conoscenza HR e set di domande di test."],
   ["Onboarding dei nuovi colleghi","Ogni nuovo ingresso richiede documenti, accessi, incontri e materiali, coordinati tra HR, responsabile e IT.","Progettare un flusso in cui l'AI prepara il piano di inserimento, i promemoria per HR, responsabile e IT, e un percorso di domande e risposte per il nuovo collega.","Ruoli e responsabilità definiti; nessun dato personale fuori dagli strumenti approvati; il responsabile valida il piano.","Schema del flusso di onboarding con punti di controllo umano."]]},

   ["Dalla tabella alla nota interna e alla corrispondenza","L'analisi deve diventare una nota per il management e una risposta alla controparte.","Partendo dalla tabella del laboratorio precedente, preparare con l'AI la nota interna e la bozza di corrispondenza, con le fonti citate; correggere una sintesi volutamente sbagliata.","Il legale verifica fedeltà al testo, completezza e tono; nessuna comunicazione esterna senza approvazione.","Modelli di nota interna e di corrispondenza con le fonti."],

function go(r){location.hash='#/'+(r==='home'?'':r);}

function navBtns(prev,next,nextLabel,prevLabel){
  var h='';

function setProgress(name){
  var idx=ORDER.indexOf(name==='lab'?'laboratori':name), h='';

  document.getElementById('progress').innerHTML=h;
}

/* ---------- interactions ---------- */
function bind(n){
  view.querySelectorAll('.blk-h').forEach(function(b){b.addEventListener('click',function(){
    var o=b.getAttribute('aria-expanded')!=='true'; b.setAttribute('aria-expanded',o); document.getElementById(b.getAttribute('aria-controls')).classList.toggle('open',o);})});
  view.querySelectorAll('[data-fs]').forEach(function(b){b.addEventListener('click',function(){
    if(+b.dataset.fs===4){nav('mentoring');return;}
    view.querySelectorAll('[data-fs]').forEach(function(x){x.setAttribute('aria-expanded',x===b)}); document.getElementById('fsd').textContent=window._fs[+b.dataset.fs][2];})});
  view.querySelectorAll('[data-ex]').forEach(function(b){b.addEventListener('click',function(){
    view.querySelectorAll('[data-ex]').forEach(function(x){x.setAttribute('aria-selected',x===b)});
    view.querySelectorAll('[data-exp]').forEach(function(p){p.classList.toggle('on',p.dataset.exp===b.dataset.ex)});})});
  var lb=document.getElementById('ladderBtn');
  if(lb){var lvl=0;lb.addEventListener('click',function(){var rs=document.querySelectorAll('#ladder .rung');lvl=(lvl+1)%3;
    rs.forEach(function(r,i){r.classList.toggle('on',i<=lvl)}); lb.textContent=lvl===2?'Ricomincia ↺':'Livello successivo →';});}
  function setLab(j){view.querySelectorAll('[data-lab]').forEach(function(x){x.setAttribute('aria-selected',+x.dataset.lab===j)});
    document.getElementById('labBody').innerHTML=labBody(window._fn,j); bindLabNav();}
  function bindLabNav(){view.querySelectorAll('[data-labgo]').forEach(function(b){b.addEventListener('click',function(){setLab(+b.dataset.labgo)})})}
  view.querySelectorAll('[data-lab]').forEach(function(b){b.addEventListener('click',function(){setLab(+b.dataset.lab)})}); bindLabNav();
  var dr=document.getElementById('drawer');
  function openSt(i){var p=document.getElementById('dpanel');p.innerHTML=stBody(i);dr.classList.add('open');
    view.querySelectorAll('[data-st]').forEach(function(x){x.classList.toggle('sel',+x.dataset.st===i)});
    p.querySelector('.dclose').addEventListener('click',closeSt);
    p.querySelectorAll('[data-stgo]').forEach(function(b){b.addEventListener('click',function(){openSt(+b.dataset.stgo)})});
    p.querySelector('.dclose').focus();}
  function closeSt(){dr.classList.remove('open');view.querySelectorAll('[data-st]').forEach(function(x){x.classList.remove('sel')});}
  if(dr){dr.addEventListener('click',function(e){if(e.target===dr)closeSt()});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSt()});}
  view.querySelectorAll('[data-st]').forEach(function(b){b.addEventListener('click',function(){openSt(+b.dataset.st)})});
}

/* ---------- menu ---------- */
var ov=document.getElementById('ov');
function buildMenu(cur,arg){
  var h='';
  ORDER.forEach(function(k){
    var tag=k==='cross'||k==='mentoring'?'<span class="tag opt">Opzionale</span>':'';
    h+='<a class="mi'+(cur===k?' cur':'')+'" href="#/'+(k==='home'?'':k)+'">'+TITLES[k]+tag+'</a>';
    if(k==='laboratori') FN.forEach(function(f){h+='<a class="mi sub'+(cur==='lab'&&arg===f.id?' cur':'')+'" href="#/lab/'+f.id+'">'+f.name+'</a>'});
  });
  document.getElementById('menuList').innerHTML=h;
}
document.getElementById('menuBtn').addEventListener('click',function(){ov.classList.add('open');document.getElementById('closeOv').focus();});
document.getElementById('closeOv').addEventListener('click',function(){ov.classList.remove('open')});
ov.addEventListener('click',function(e){if(e.target===ov||e.target.closest('.mi'))ov.classList.remove('open')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')ov.classList.remove('open')});

render();
</script>
</body>
</html>
